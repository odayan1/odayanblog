#vp .vbar button{flex:1;border:0;border-radius:12px;padding:12px;font-size:16px;font-weight:800;font-family:inherit;background:var(--acc);color:#fff;cursor:pointer}
#vp .vbar a{color:#ddd;font-size:12px;text-decoration:underline}
/* 経済の傾向と対策（16）。u15.css と同じ部品（段の札・4段の地図・横棒・タイル・ひっかけタグ）。色はエンジンのまま */
.u16t{display:inline-block;border-radius:7px;padding:1px 8px;font-weight:900;font-size:12.5px;line-height:1.7;white-space:nowrap}
.u16t.t0{background:#fde2e0;color:#b3261e}.u16t.t1{background:#fde9d6;color:#a4521b}
.u16t.t2{background:#fff3c4;color:#7a5d00}.u16t.t3{background:#e9edf0;color:#4b5963}
/* 4段の地図（表） */
.u16map{display:flex;flex-direction:column;gap:6px}
.u16map .rw{display:flex;gap:8px;align-items:flex-start;background:#fff;border:2px solid #e1ecec;border-radius:12px;padding:8px 10px}
.u16map .rw.t0{border-color:#f3b4ae}.u16map .rw.t1{border-color:#f2c49c}.u16map .rw.t2{border-color:#ecd77a}.u16map .rw.t3{border-color:#cfd8dc}
.u16map .rw .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--main);color:#fff;font-weight:900;display:grid;place-items:center;font-size:13px;margin-top:2px}
.u16map .rw small{display:block;color:#556;font-size:12.5px;line-height:1.55;margin-top:2px}
.u16arrow{text-align:right;font-weight:800;color:var(--acc);font-size:13px;margin-top:4px}
/* 横棒グラフ（問数） */
.u16bar{display:grid;grid-template-columns:5.6em 1fr;gap:6px;align-items:center;margin:6px 0;font-size:13.5px}
.u16bar .lb{font-weight:800;text-align:right}
.u16bar .bw{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.u16bar .b{height:18px;border-radius:5px;background:linear-gradient(90deg,#e0564a,#ff8a7a);color:#fff;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:flex-end;padding-right:5px}
.u16bar .pv{font-size:11.5px;font-weight:800;color:#0e6f78;background:var(--soft);border-radius:99px;padding:0 7px}
/* タイル（論点＋一言） */
.u16tiles{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.u16tiles div{background:#fff;border:2px solid #e1ecec;border-radius:11px;padding:7px 9px;font-size:13px;line-height:1.55}
.u16tiles div b{display:block;color:var(--main);font-size:14px}
.u16tiles div.w{grid-column:1/-1}
/* ひっかけタグ */
.u16tag{display:inline-block;background:#fff0ec;color:#c2412f;border:1.5px solid #ffc9bd;border-radius:7px;padding:0 7px;font-weight:900;font-size:12.5px;line-height:1.7;margin-right:4px;white-space:nowrap}
.u16tags{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.u16tags div{background:#fffaf8;border:2px solid #ffd1c9;border-radius:11px;padding:7px 9px;font-size:13px;line-height:1.55}
.u16tags div b{display:block;color:#c2412f;font-size:14px}
.u16note{font-size:11.5px;color:#6b7885;margin-top:6px;line-height:1.6}
/* 仕分けゲームのカード（論点名・ひっかけの文が長いので小さめ） */
.sortcard{font-size:16px;line-height:1.5}
/* 横棒の右に「くり返し出た中身」 */
.u16bar .pv{color:#556;background:none;padding:0;font-weight:700}
/* 資料問題の表（数字は右寄せ） */
.doc table.u16tb td{text-align:right}.doc table.u16tb td:first-child{text-align:center;font-weight:800}
.u16tiles div b.i,.u16tags div b.i{display:inline;font-size:inherit}
.box small b{display:inline;font-size:inherit}
.doc table.u16tb{font-size:12.5px}.doc table.u16tb th,.doc table.u16tb td{padding:4px 3px;line-height:1.35}.doc table.u16tb th{font-size:11.5px}

/* --- アクセス計測（GoatCounter：Cookieなし・個人情報なし／2026-10-26 広告の効果測定用）
   GC に GoatCounter のサイトコードを入れると、公開ページ（*.github.io）でだけ数える。空なら何もしない（プレビュー・E2Eも数えない）。
   数えるもの＝①ページを開いた回数（どこから来たか。広告のURLには ?utm_source=yt-ad などをつける）
             ②結果画面まで解いた回数（qup-seikei-NN/done-<章や種類>）③ラボを開いた回数（qup-seikei-NN/lab） --- */
const GC = "qup-seikei";
/* 2026-11-02 odayanblog.com/seikei/NN/ へ移設。2026-11-01 確認用の置き場（/preview/ 以下）は数えない */
const LIVE = !!GC && /(\.github\.io|odayanblog\.com)$/.test(location.hostname) && !/\/preview/.test(location.pathname);
if (LIVE) { const s = document.createElement("script"); s.async = true; s.dataset.goatcounter = `https://${GC}.goatcounter.com/count`; s.src = "https://gc.zgo.at/count.js"; document.head.appendChild(s); }
const REPO = (location.pathname.match(/\/seikei\/(\d+)\//) ? "qup-seikei-" + location.pathname.match(/\/seikei\/(\d+)\//)[1] : location.pathname.split("/")[1]) || "local";  // 計測名は移設前と同じ qup-seikei-NN
function track(name) { try { if (LIVE && window.goatcounter && window.goatcounter.count) window.goatcounter.count({ path: `${REPO}/${name}`, title: name, event: true }); } catch (e) { /* 計測の失敗で学習を止めない */ } }
/* --- 学習記録（2026-11-05 まっさん：作り直した回から、自前の記録へ切り替え）
   送り先＝Apps Script → スプレッドシート「学習記録（アプリ）」。build.py の LOG_UNITS に入っている回だけ URL が入る（ほかの回は空＝何もしない）。
   送るのは LIVE と同じ条件（公開ページだけ。プレビュー・E2Eは送らない）。一般の人向けなので名前・IDは送らない（?id= があればそれだけ）。端末ごとの乱数で同じ人をまとめる。
   1問答えるごとに「途中」を用意 → ホームにもどる／画面を閉じたら1件、結果画面で「完了」を1件。開いただけでは送らない（ボット除け）。
   まちがえた問題は「章id-番号」（例 c2-3）・ひっかけ「T番号」・共通テスト形式「K番号」で送る＝問題ごとの正答率がわかる。 */
const LOG_URL = "";
const QLOG = (() => {
  const ON = LIVE && /^https:\/\//.test(LOG_URL);
  const sid = (new URLSearchParams(location.search).get("id") || "").toLowerCase().replace(/[^a-z0-9-]/g, "").slice(0, 20);
  const dev = (() => { try { let d = localStorage.getItem("__dev"); if (!d) { d = Math.random().toString(36).slice(2, 12); localStorage.setItem("__dev", d); } return d; } catch (e) { return "nostore"; } })();
  let pending = null;
  const queue = rec => { try { const q = JSON.parse(localStorage.getItem("__q") || "[]"); q.push(rec); localStorage.setItem("__q", JSON.stringify(q.slice(-50))); } catch (e) {} };
  const post = rec => { try { fetch(LOG_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(rec) }).catch(() => queue(rec)); } catch (e) { queue(rec); } };

const UNIT = {

  video: "", videoLen: "10分",   /* 尺はレンダ確定値（11/03 23:40 次回予告を外した差し替え版＝600.3秒）。video が空のあいだは表示されない。 ★動画を公開したら video に "https://youtu.be/<動画ID>"、videoLen に実際の長さ（例 "9分42秒"） */

<script>
/* ===== 単元データの読み込み ===== */
VIDEO = UNIT.video; KEY = UNIT.key;
/* 2026-10-24 番号を分野ごとに（経済N／政治N／国際N／公共N）。UNIT.label が無い古い単元は「政経N」 */
const LABEL = UNIT.label || ("政経" + UNIT.no);
const CH = UNIT.chapters, TRAPS = UNIT.traps, KY = UNIT.kyotsu;
CH.forEach((c, i) => c.qs.forEach(q => q.sec = c.id));
TRAPS.forEach(q => q.sec = "trap");
KY.qs.forEach(q => { q.sec = "kyotsu"; q.ky = true; });
const ALLQ = CH.flatMap(c => c.qs).concat(TRAPS);
const ALLQK = ALLQ.concat(KY.qs);

/* ===== 2026-11-01 v2：用語タップ説明・辞書（読みもの）・アプリ内で動画を再生 =====
   UNIT.glossary = [{ w:"語" か ["語","別名"], r:"読み", d:"短い説明(HTML可)", page?:"辞書の読みものid", t?:動画の秒 }]
   UNIT.dict     = [{ id, icon, title, sub, html }]（深掘りの読みもの。重ねて開くので、閉じると元の画面にそのまま戻る）
   問題の q.x    = 「📘 補足（教科書）」として解説の下に出す（動画で言っていない、教科書の説明を足すとき）
   YouTube の動画リンク（youtu.be／watch?v=）は、どこにあってもアプリの中のプレーヤーで開く＝閉じれば同じ画面に戻れる。 */
const GLOS = UNIT.glossary || [], DICT = UNIT.dict || [];
const GMAP = new Map(); GLOS.forEach((g, i) => [].concat(g.w).forEach(w => GMAP.set(w, i)));
const GSRC = [...GMAP.keys()].sort((a, b) => b.length - a.length).map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|");
const GSKIP = "svg,button,a,input,textarea,.choices,.pool,.answer,.sortcard,.hidec,.q,.q2,.stage,h1,h2,h3,.gl,.qq,.ya,.aa,.ans,.exits,footer,.vcard,.menu,.prog,.tf,.doc,.fmt,.score,.badge,.cmp,.hist";
/* 1回の呼び出しで、各用語の「最初の1回」だけを点線ボタンにする（問題文・選択肢・答えには付けない＝答えが漏れない） */
function glossify(root) {
  if (!GSRC || !root) return;
  const re = new RegExp(GSRC, "g"), re1 = new RegExp(GSRC), seen = new Set(), nodes = [];
  const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => n.parentElement && re1.test(n.nodeValue) && !n.parentElement.closest(GSKIP) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT });
  while (tw.nextNode()) nodes.push(tw.currentNode);
  nodes.forEach(n => {
    const s = n.nodeValue; let last = 0, out = null, m; re.lastIndex = 0;
    while ((m = re.exec(s))) {
      const gi = GMAP.get(m[0]); if (seen.has(gi)) continue; seen.add(gi);
      out = out || document.createDocumentFragment(); out.append(s.slice(last, m.index));
      const b = document.createElement("button"); b.type = "button"; b.className = "gl"; b.dataset.g = gi; b.textContent = m[0]; out.append(b);
      last = m.index + m[0].length;
    }
    if (out) { out.append(s.slice(last)); n.replaceWith(out); }
  });
}
function openSheet(gi) {
  const g = GLOS[gi]; if (!g) return;
  $("#gbox").innerHTML = `<div><span class="gw">${[].concat(g.w).join("／")}</span>${g.r ? `<span class="gr">${g.r}</span>` : ""}</div><div class="gd">${g.d}</div>
    <div class="gx">${g.page && g.page !== DOPEN ? `<button class="gpage" data-page="${g.page}">📖 くわしく読む</button>` : ""}${VIDEO && (g.t || g.t === 0) ? `<a class="gvid" href="${VIDEO}?t=${g.t}">▶ 動画のこの場面</a>` : ""}<button class="gcl" id="gcl">とじる</button></div>`;

}
function closeSheet() { const s = document.getElementById("gsheet"); if (s) s.style.display = "none"; }
/* 2026-11-05 読みものを開いている間は、そのページ自身への「くわしく読む」を出さない（押しても同じ読みものの先頭に戻るだけになるため） */
let DOPEN = null;
function openDict(id) {

    ${DICT.length ? `<div class="sec" style="color:#8a6d12">深掘りの読みもの（入試の先の「学問の入口」）</div><div class="menu">${DICT.map(d => `<button class="item dic" data-page="${d.id}"><span class="ic">${d.icon || "📖"}</span><span><b>${d.title}</b><small>${d.sub}</small></span></button>`).join("")}</div>` : ""}
    <div class="sec">ことば（動画に出てくる順）</div><div class="glist">${GLOS.map((g, i) => `<button data-g="${i}"><span>${[].concat(g.w).join("／")}</span><small>${g.r || ""}</small></button>`).join("")}</div>
    <button class="btn sub" onclick="home()">ホームにもどる</button></div>`);
}
const ytId = h => { const m = String(h).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([\w-]{11})/); return m ? m[1] : null; };
const ytT = h => { const m = String(h).match(/[?&](?:t|start)=(\d+)/); return m ? Number(m[1]) : 0; };
function openPlayer(href) {

  $("#vfr").innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${id}?start=${t}&autoplay=1&playsinline=1&rel=0" title="動画" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
  $("#vext").href = `https://youtu.be/${id}${t ? "?t=" + t : ""}`; $("#vp").style.display = "flex"; track("play");
}
function closePlayer() { $("#vfr").innerHTML = ""; $("#vp").style.display = "none"; }
document.addEventListener("click", e => {
  const pg = e.target.closest("[data-page]"); if (pg) { e.preventDefault(); openDict(pg.dataset.page); return; }
  const gl = e.target.closest("[data-g]"); if (gl) { e.preventDefault(); openSheet(Number(gl.dataset.g)); return; }
  const a = e.target.closest("a[href]"); if (a && a.id !== "vext" && ytId(a.href)) { e.preventDefault(); closeSheet(); openPlayer(a.href); }
});
const more = q => q.x ? `<div class="more"><b class="mh">📘 補足（教科書）</b><br>${q.x}</div>` : "";

/* ===== ポイント・済マーク ===== */
let pts = Number(store.getItem(KEY + "pts") || 0);
function addPts(n) { pts += n; store.setItem(KEY + "pts", pts); $("#pt").textContent = pts + " pt"; }
const done = () => JSON.parse(store.getItem(KEY + "done") || "{}");
function markDone(k) { const d = done(); d[k] = true; store.setItem(KEY + "done", JSON.stringify(d)); }

/* ===== スコアの記録（やり直したとき、前回とベストが分かるように） ===== */
const hist = sec => JSON.parse(store.getItem(KEY + "h_" + sec) || "[]");
function record(sec, ok, n) {
  const h = hist(sec), prev = h.length ? h[h.length - 1] : null;
  const best = h.reduce((m, x) => Math.max(m, x.pc), -1);
  const d = new Date(), pc = Math.round(ok / n * 100);
  h.push({ pc, ok, n, d: `${d.getMonth() + 1}/${d.getDate()}` });
  store.setItem(KEY + "h_" + sec, JSON.stringify(h.slice(-20)));
  store.removeItem(KEY + "p_" + sec); /* 最後まで解いたので「途中まで」は消す */
  return { prev, best, pc, all: h.slice(-6) };
}
/* 2026-11-01 途中までの記録（まっさん指示）：答えるたびに上書き保存。途中でやめても・ページを閉じても残る。最後まで解いたら record() が消す。
   前回・ベスト（h_）には入れない＝途中の数字でベストや前回比べがずれないように。 */
const partial = sec => JSON.parse(store.getItem(KEY + "p_" + sec) || "null");
function savePartial(sec, res, n, kind, list) {
  if (!sec || !res.length) return;
  const d = new Date();
  /* 2026-11-07 続きから再開できるように、問題の順番（q）と答え（r）も残す */
  store.setItem(KEY + "p_" + sec, JSON.stringify({ ok: res.filter(r => r.ok).length, a: res.length, n, d: `${d.getMonth() + 1}/${d.getDate()}`,
    ...(kind && list ? { kind, q: list.map(qid), r: packRes(res) } : {}) }));
  QLOG.step(logRec(sec, res, n));
}
function histTag(sec) {
  const h = hist(sec), p = partial(sec);
  const pt = p ? `<span class="hs part">途中まで ${p.a}/${p.n}問（正解${p.ok}）・${p.d}${canResume(p) ? `<span class="cont">▶ 続きから</span>` : ""}</span>` : "";
  if (!h.length) return pt;
  const last = h[h.length - 1], best = Math.max(...h.map(x => x.pc));
  return `<span class="hs">前回 ${last.ok}/${last.n}（${last.pc}%）・ベスト ${best}%・${h.length}回</span>${pt ? " " + pt : ""}`;
}
function cmpHtml(r) {
  if (!r) return "";
  const p = r.prev;
  const line = !p ? `<div class="cmp eq">はじめての記録だよ！次はこのスコアを超えよう</div>`
    : r.pc > p.pc ? `<div class="cmp"><span class="up">▲ 前回 ${p.pc}% → 今回 ${r.pc}%（+${r.pc - p.pc}）</span></div>`
    : r.pc < p.pc ? `<div class="cmp"><span class="dn">▼ 前回 ${p.pc}% → 今回 ${r.pc}%</span></div>`
    : `<div class="cmp eq">前回と同じ ${r.pc}%</div>`;
  const best = r.best >= 0 && r.pc > r.best ? `<div class="cmp up">🏅 ベスト更新！（これまで ${r.best}%）</div>` : r.best >= 0 ? `<div class="cmp eq">ベスト ${Math.max(r.best, r.pc)}%</div>` : "";
  const chips = r.all.length > 1 ? `<div class="hist">${r.all.map((x, i) => `<span class="${i === r.all.length - 1 ? "now" : ""}">${x.d} ${x.pc}%</span>`).join("")}</div>` : "";
  return line + best + chips;
}

/* ===== 2026-11-07 今いる場所の保存と復帰・続きから（まっさん：「YouTubeで開く」で動画を見て戻ると、アプリが最初からになる／途中から始めたい）
   スマホは別のアプリ（YouTube）へ行くと、戻ったときにページを読み込み直すことがある＝画面の中身（メモリ）が消えて「はじめに」に戻っていた。
   → 画面が変わるたび・1問答えるたびに「今いる場所」を store（KEY+"now"）に保存。開いたときに NOW_MAX 以内の保存があれば、はじめにではなくその画面に戻す
     （問題の途中なら答えた問題と点数もそのまま、解説を読んでいたらその解説の画面、辞書の読みものを開いていたらそれも開く、スクロール位置も）。
   → 「途中まで」の記録（p_）に問題の順番と答えも残し、ホームで押すと「続きから／最初から」を選べる（ランダムな順番のひっかけ・まとめテストも同じ順番で続く）。
   問題は qid（章id-番号／T番号／K番号）で覚える。単元のデータが変わって見つからない問題があれば、続きからは出さない（最初から）。 */
const NOW_MAX = 3 * 3600 * 1000;
let NOW = null;
function saveNow(o) {
  if (o !== undefined) NOW = o;
  try { if (NOW) store.setItem(KEY + "now", JSON.stringify(Object.assign({}, NOW, { ts: Date.now(), dict: DOPEN || undefined, y: Math.round(window.scrollY || 0) }))); } catch (e) { /* 保存できなくても学習は止めない */ }
}
const QBY = new Map(ALLQK.map(q => [qid(q), q]));
const packRes = res => res.map(x => [x.ok ? 1 : 0, x.picked === undefined ? null : x.picked, x.v === undefined ? null : x.v]);
const unpackRes = (list, r) => r.map((x, k) => ({ q: list[k], ok: !!x[0], picked: x[1] === null ? undefined : x[1], v: x[2] === null ? undefined : x[2] }));
const listOf = ids => { const l = (ids || []).map(id => QBY.get(id)); return l.length && l.every(Boolean) ? l : null; };
function canResume(p) { return !!(p && p.kind && p.q && p.r && p.r.length > 0 && p.r.length < p.q.length && listOf(p.q) && qopt(p.kind)); }
/* 問題のまとまり（kind）から、quiz の opt を作り直す＝保存した途中から同じ形で再開できる */
function qopt(kind) {
  if (!kind) return null;
  if (kind.t === "ch") { const i = kind.i, c = CH[i]; if (!c) return null; const title = `${c.icon} ${i + 1}. ${c.title}`;
    return { kind, title, label: "確認問題", sec: c.id, done: res => { markDone(c.id); resultScreen(res, { sec: c.id, title, chapter: i }); } }; }
  if (kind.t === "trap") return { kind, title: "⚠️ ひっかけ ○×", label: "問題", sec: "trap", done: res => { markDone("trap"); resultScreen(res, { sec: "trap", title: "⚠️ ひっかけ ○×" }); } };
  if (kind.t === "test") return { kind, title: "📝 まとめテスト", label: "問題", sec: "test", done: res => resultScreen(res, { sec: "test", title: "📝 まとめテスト" }) };
  if (kind.t === "ky") return { kind, title: "🎯 共通テスト形式", label: "問", sec: "kyotsu", done: res => { markDone("kyotsu"); resultScreen(res, { sec: "kyotsu", title: "🎯 共通テスト形式", ky: true }); } };
  if (kind.t === "retry" && kind.o) { const o = kind.o; return { kind, title: o.title + "（まちがえた問題）", label: "問題", done: res => resultScreen(res, { ...o, sec: null, retry: true }) }; }

}
function resumeQuiz(kind, ids, r, fb) {

/* ホームで押したとき：「途中まで」があれば 続きから／最初から を選ぶ。なければ今まで通り最初から */
function startSec(sec, fresh) {

function histNow(sec) {
  const h = hist(sec); if (!h.length) return null;
  const cur = h[h.length - 1], before = h.slice(0, -1);
  return { prev: before.length ? before[before.length - 1] : null, best: before.reduce((m, x) => Math.max(m, x.pc), -1), pc: cur.pc, all: h.slice(-6) };
}

/* --- 章：説明カード → 確認問題 --- */
function chapter(i, k0) {
  const c = CH[i]; let k = Math.max(0, Math.min(Number(k0) || 0, c.cards.length - 1));
  const show = () => {
    if (k >= c.cards.length) return quiz(c.qs, qopt({ t: "ch", i }));
    saveNow({ s: "card", i, k });
    const cd = c.cards[k];
    screen(`<div class="card pop"><div class="stage">${c.icon} ${i + 1}. ${c.title}　｜　説明 ${k + 1}/${c.cards.length}</div>
      ${prog(k, c.cards.length)}

      ${vlink(cd.t)}
      <button class="btn main" id="nx">${k + 1 < c.cards.length ? "次へ" : "確認問題へ ✏️"}</button>
      ${k > 0 ? `<button class="btn sub" id="bk">もどる</button>` : ""}
      <button class="btn sub" onclick="home()">ホームにもどる</button></div>`);
    if (cd.after) cleanup = cd.after();
    $("#nx").onclick = () => { k++; show(); };
    if (k > 0) $("#bk").onclick = () => { k--; show(); };
  };
  show();
}

/* --- 問題ランナー（4択・○×・並べ替え・共通テスト形式・立場選択の2段 k:"st"） --- */
function quiz(list, opt, resume) {
  let i = 0; const res = []; QLOG.t0 = Date.now();
  /* 2026-11-07 続きから：resume.r＝答えた問題、resume.fb＝最後に答えた問題の解説を読んでいた（その解説の画面にもどす） */
  let replay = null, replaying = false;
  if (resume && Array.isArray(resume.r) && resume.r.length) {
    res.push(...unpackRes(list, resume.r)); i = res.length;
    const last = res[res.length - 1];
    if ((resume.fb || i >= list.length) && last.v !== undefined) { i = res.length - 1; replay = last; }
    else if (i >= list.length) i = list.length - 1, res.pop();
  }
  const ids = list.map(qid);
  const here = fb => { if (opt.kind) saveNow({ s: "quiz", kind: opt.kind, q: ids, r: packRes(res), fb }); };
  const one = () => {
    if (i >= list.length) return opt.done(res);
    const q = list[i];
    let body = "";
    if (q.k === "mc") {
      const order = q.ky ? q.c.map((_, j) => j) : shuffle(q.c.map((_, j) => j));
      body = `<div class="choices${q.ky ? " kyc" : ""}">${order.map((j, n) => `<button data-j="${j}">${q.ky ? `<span class="no">${NO[n]}</span>` : ""}${q.c[j]}</button>`).join("")}</div>`;
    } else if (q.k === "tf") {
      body = `<div class="tf"><button class="o" data-v="1">○</button><button class="x" data-v="0">×</button></div>`;
    } else if (q.k === "st") {
      /* 立場選択（G）の2段：q.st＝立場、q.q2＝2段目の問い、q.c＝根拠ア〜、q.a＝立場ごとの正しい根拠の番号の配列（例 [[0,2],[1,3]]） */
      body = `<div class="choices kyc stb" id="stb">${q.st.map((s, j) => `<button data-s="${j}"><span class="no">${NO[j]}</span>${s}</button>`).join("")}</div>
        <div id="st2" style="display:none"><div class="q2"><span class="stg">STEP②</span>${q.q2}</div>
        <div class="choices kyc gr" id="gr">${q.c.map((c, j) => `<button data-j="${j}"><span class="no">${KANA[j]}</span>${c}</button>`).join("")}</div>
        <button class="btn ky" id="ck2" disabled>答え合わせ</button></div>`;
    } else {
      let pool; do { pool = shuffle(q.items); } while (pool.every((x, j) => x === q.items[j]));
      body = `<div class="muted" style="margin-top:6px">古い順・正しい順に、下からタップして並べよう</div>
        <div class="answer" id="ans"><div class="ph">ここに並ぶよ</div></div>
        <div class="pool" id="pool">${pool.map(x => `<button class="chip">${x}</button>`).join("")}</div>
        <div class="row2"><button class="btn sub" id="rs">やり直す</button><button class="btn main" id="ck" disabled>答え合わせ</button></div>`;
    }
    screen(`<div class="card pop"><div class="stage">${opt.title}　｜　${opt.label} ${i + 1}/${list.length}</div>${prog(i, list.length)}
      ${q.fmt ? `<span class="fmt">${q.fmt}</span>` : ""}${q.pre ? q.pre : ""}
      <div class="q">${q.k === "tf" ? "○か×か？<br>" : ""}${q.k === "st" ? `<span class="stg">STEP①</span>` : ""}${q.q}</div>${body}<div id="fbx"></div></div>
      <button class="btn sub" id="hm">ホームにもどる</button>`);
    $("#hm").onclick = askHome;
    let answered = false;
    const finish = (ok, ansText, picked, v) => {
      answered = true;
      if (!replaying) { res.push({ q, ok, picked, v }); if (ok) addPts(q.ky ? 20 : 10); savePartial(opt.sec, res, list.length, opt.kind, list); }
      here(true);
      const why = q.k === "st" ? whySt(q) : q.w ? `<div class="why">${q.c.map((c, j) => `<div><span class="no">${NO[j]}</span><span class="${j === q.a ? "okm" : "ngm"}">${j === q.a ? "○" : "×"}</span> ${q.w[j]}</div>`).join("")}</div>` : "";
      $("#fbx").innerHTML = `<div class="fb ${ok ? "ok" : "ng"} pop"><h3>${ok ? `⭕ 正解！ +${q.ky ? 20 : 10}pt` : "❌ ざんねん…"}</h3>
        ${ok ? "" : `<div class="ans">正解：${ansText}</div>`}<div>${q.e}</div>${more(q)}${why}
        ${q.tip ? `<div class="tip"><b class="h">🎯 共通テストではこう出る</b><br>${q.tip}</div>` : ""}${vlink(q.t)}</div>
        <button class="btn main" id="nx">${i + 1 < list.length ? "次の問題へ" : "結果を見る"}</button>`;
      glossify($("#fbx"));
      $("#nx").onclick = () => { i++; one(); };
      if (!replaying) $("#nx").scrollIntoView({ behavior: "smooth", block: "end" });
    };
    if (q.k === "mc") {
      const bs = document.querySelectorAll(".choices button");
      bs.forEach((b, n) => b.onclick = () => {
        const j = Number(b.dataset.j), ok = j === q.a;
        bs.forEach(x => { x.disabled = true; if (Number(x.dataset.j) === q.a) x.classList.add("ok"); });
        if (!ok) b.classList.add("ng");
        finish(ok, (q.ky ? NO[q.a] + " " : "") + q.c[q.a], (q.ky ? NO[j] + " " : "") + q.c[j], j);
      });
    } else if (q.k === "tf") {
      document.querySelectorAll(".tf button").forEach(b => b.onclick = () => {
        const v = b.dataset.v === "1", ok = v === q.a;
        document.querySelectorAll(".tf button").forEach(x => { x.disabled = true; if ((x.dataset.v === "1") === q.a) x.classList.add("ok"); });
        if (!ok) b.classList.add("ng");
        finish(ok, q.a ? "○" : "×", v ? "○" : "×", v ? 1 : 0);
      });
    } else if (q.k === "st") {
      /* ①立場（答え合わせまでは選び直せる）→ ②根拠を q.a[立場] の数だけ選ぶ → 答え合わせ。立場はどちらでも正解になりうる */
      let s = -1; const sel = new Set();
      const sbs = document.querySelectorAll("#stb button"), gbs = document.querySelectorAll("#gr button");
      const need = () => (s >= 0 ? q.a[s].length : 0);
      const draw = () => { gbs.forEach(b => b.classList.toggle("sel", sel.has(Number(b.dataset.j)))); $("#ck2").disabled = !(s >= 0 && sel.size === need()); };
      sbs.forEach(b => b.onclick = () => {
        s = Number(b.dataset.s); sbs.forEach(x => x.classList.toggle("pick", x === b));
        while (sel.size > need()) sel.delete([...sel][0]);
        $("#st2").style.display = ""; draw();
      });
      gbs.forEach(b => b.onclick = () => {
        const j = Number(b.dataset.j);
        if (sel.has(j)) sel.delete(j); else if (sel.size < need()) sel.add(j); else if (need() === 1) { sel.clear(); sel.add(j); }
        draw();
      });
      $("#ck2").onclick = () => {
        const pick = [...sel].sort((x, y) => x - y), right = q.a[s];
        const ok = pick.length === right.length && pick.every(j => right.includes(j));
        sbs.forEach(x => x.disabled = true); gbs.forEach(x => x.disabled = true); $("#ck2").disabled = true;
        gbs.forEach(x => { const j = Number(x.dataset.j); x.classList.remove("sel"); if (right.includes(j)) x.classList.add("ok"); else if (sel.has(j)) x.classList.add("ng"); });
        finish(ok, `${NO[s]}（${q.st[s]}）を選んだなら ${right.map(j => KANA[j]).join("と")}`, `${NO[s]} ${q.st[s]}・${pick.map(j => KANA[j]).join("と")}`, [s, pick]);
      };
    } else {
      const picked = [];
      const draw = () => {
        $("#ans").innerHTML = picked.length ? picked.map((x, j) => `<div class="chip"><b>${j + 1}</b>${x}</div>`).join("") : `<div class="ph">ここに並ぶよ</div>`;
        $("#ck").disabled = picked.length !== q.items.length;
      };
      document.querySelectorAll("#pool .chip").forEach(b => b.onclick = () => { picked.push(b.textContent); b.classList.add("used"); draw(); });
      $("#rs").onclick = () => { picked.length = 0; document.querySelectorAll("#pool .chip").forEach(b => b.classList.remove("used")); draw(); };
      $("#ck").onclick = () => {
        const ok = picked.every((x, j) => x === q.items[j]);
        $("#ck").disabled = true; $("#rs").disabled = true;
        finish(ok, q.items.map((x, j) => `${j + 1}. ${x}`).join("　→ "), picked.join(" → "), picked.slice());
      };
    }
    if (replay && replay.q === q) {
      /* 解説を読んでいた問題：保存した答えをもう一度押して、同じ解説の画面にする（記録・ポイントは二重にしない） */
      const v = replay.v; replay = null; replaying = true;
      try {
        const clk = sel => { const b = document.querySelector(sel); if (b) b.click(); };
        if (q.k === "mc") clk(`.choices button[data-j="${v}"]`);
        else if (q.k === "tf") clk(`.tf button[data-v="${v}"]`);
        else if (q.k === "st") { clk(`#stb button[data-s="${v[0]}"]`); v[1].forEach(j => clk(`#gr button[data-j="${j}"]`)); clk("#ck2"); }
        else { v.forEach(t => { const b = [...document.querySelectorAll("#pool .chip:not(.used)")].find(x => x.textContent === t); if (b) b.click(); }); clk("#ck"); }
      } catch (e) { /* もどせなければ、この問題を解き直す */ }
      replaying = false;
      if (!answered) { res.pop(); here(false); }
    } else here(false);
  };
  one();
}

/* 立場選択（G）の解説：根拠ごとに「どちらの立場の根拠か／どちらにもならない（誤り）」を示す＝両方の立場の根拠が分かる */
function whySt(q) {
  const owner = j => q.a.findIndex(r => r.includes(j));
  return `<div class="why">${q.st.map((s, k) => `<div><span class="no">${NO[k]}</span><b>${s}</b>の根拠＝<b>${q.a[k].map(j => KANA[j]).join("と")}</b></div>`).join("")}
    ${q.c.map((c, j) => { const k = owner(j); return `<div><span class="no">${KANA[j]}</span><span class="${k >= 0 ? "okm" : "ngm"}">${k >= 0 ? NO[k] + "の根拠" : "どちらの根拠にもならない"}</span> ${q.w ? q.w[j] : c}</div>`; }).join("")}</div>`;
}
const ansSt = q => q.st.map((s, k) => `${NO[k]}（${s}）なら ${q.a[k].map(j => KANA[j]).join("と")}`).join("／");

/* --- ひっかけ・まとめテスト・共通テスト形式 --- */
function traps() { quiz(shuffle(TRAPS), qopt({ t: "trap" })); }
function test() { quiz(shuffle(ALLQ).slice(0, 15), qopt({ t: "test" })); }
function kyotsu() {
  saveNow({ s: "kyintro" });
  screen(`<div class="card pop"><div class="stage" style="color:var(--ky)">🎯 STEP2　共通テストではこう出る</div>
    <h2 style="margin-top:8px">共通テスト形式 ${KY.qs.length}問</h2>
    ${bubble("important", KY.intro)}
    <div class="tip"><b class="h">この${KY.qs.length}問の形</b><br>${KY.formats}<br>選択肢は共通テストと同じく①②③④…の番号つき。1問ごとに「共通テストではこう出る」解説が出るよ。</div>
    ${histTag("kyotsu") ? `<div style="margin-top:8px">${histTag("kyotsu")}</div>` : ""}
    ${canResume(partial("kyotsu")) ? `<button class="btn ky" id="kr">▶ 続きから（${partial("kyotsu").a + 1}問目〜）</button><button class="btn sub" id="go">最初から</button>` : `<button class="btn ky" id="go">はじめる</button>`}
    <button class="btn sub" onclick="home()">ホームにもどる</button></div>`);
  $("#go").onclick = () => quiz(KY.qs, qopt({ t: "ky" }));
  if ($("#kr")) $("#kr").onclick = () => { const p = partial("kyotsu"); if (!resumeQuiz(p.kind, p.q, p.r, false)) quiz(KY.qs, qopt({ t: "ky" })); };
}
function retryWrong(list, opt) {
  quiz(list, qopt({ t: "retry", o: { sec: opt.sec, title: opt.title, chapter: opt.chapter, ky: opt.ky } }));
}

/* --- 結果画面（前回・ベストと比べる＋まちがえた問題の復習） --- */
function resultScreen(res, opt) {
  const ok = res.filter(r => r.ok).length, n = res.length, pc = Math.round(ok / n * 100);
  const wrong = res.filter(r => !r.ok);
  const rs = !!opt.restored; /* 2026-11-07 さっきの結果画面にもどしただけ＝記録・送信・紙ふぶきはしない */
  if (!rs) { track("done-" + (opt.retry ? "retry" : opt.sec || "other")); QLOG.done(logRec(opt.retry ? "retry" : opt.sec, res, n)); }
  const r = opt.sec ? (rs ? histNow(opt.sec) : record(opt.sec, ok, n)) : null;
  if (!rs && opt.sec === "test" && pc >= 70) markDone("test");
  opt = { sec: opt.sec, title: opt.title, chapter: opt.chapter, ky: opt.ky, retry: opt.retry };
  const ansOf = q => q.k === "mc" ? (q.ky ? NO[q.a] + " " : "") + q.c[q.a] : q.k === "tf" ? (q.a ? "○" : "×") : q.k === "st" ? ansSt(q) : q.items.join(" → ");
  const badge = pc === 100 ? "🎉 全問正解！" : pc >= 90 ? "🏆 S級！" : pc >= 70 ? "👍 合格ライン！" : "もう一歩！";
  const msg = opt.ky
    ? (pc >= 80 ? "共通テストの形でも解けたね！この分野の出方は下のまとめでもう一度確認しよう。" : "共通テストは、言葉を知っているだけでなく<b>あてはめ</b>が問われるよ。下のまとめと解説を読んで、もう一度挑戦しよう。")
    : (pc === 100 ? "完璧！この調子で次へいこう！" : pc >= 70 ? "いい感じ！まちがえたところだけ、動画で見直しておこう。" : "大丈夫、ここから伸びるよ。まちがえた問題の「▶ 動画で確認」から、その場面を見直してね。");
  window.__wrong = wrong.map(x => x.q); window.__opt = opt;
  let nextBtn = "";
  if (opt.chapter !== undefined) nextBtn = opt.chapter + 1 < CH.length
    ? `<button class="btn main" onclick="chapter(${opt.chapter + 1})">次の章へ：${CH[opt.chapter + 1].icon} ${CH[opt.chapter + 1].title}</button>`
    : UNIT.lab ? `<button class="btn main" onclick="lab()">${UNIT.lab.icon} ${UNIT.lab.title} へ</button>` : `<button class="btn main" onclick="traps()">⚠️ ひっかけ ○× へ</button>`;
  const again = opt.sec === "trap" ? "traps()" : opt.sec === "test" ? "test()" : opt.sec === "kyotsu" || opt.ky ? "kyotsu()" : opt.chapter !== undefined ? `chapter(${opt.chapter})` : "home()";
  screen(`<div class="card pop"><div class="stage" style="text-align:center">${opt.title}　結果${opt.retry ? "（まちがえた問題だけ）" : ""}</div>
    <div class="score">${opt.chapter !== undefined ? `${ok}/${n}` : pc + "%"}</div><div class="muted" style="text-align:center">${n}問中 ${ok}問 正解</div><div class="badge">${badge}</div>
    ${cmpHtml(r)}
    ${bubble(pc === 100 ? "fist-pump" : pc >= 70 ? "thumbs-up" : "math-trouble", msg)}
    ${opt.ky ? `<div class="tip"><b class="h">🎯 この分野は、共通テストではこう出る</b><br>${KY.summary}</div>` : ""}
    ${wrong.length ? `<button class="btn main" onclick="retryWrong(window.__wrong, window.__opt)">まちがえた${wrong.length}問だけ もう一度</button>` : ""}
    ${nextBtn}
    <button class="btn ${wrong.length || nextBtn ? "sub" : "main"}" onclick="${again}">もう一度チャレンジ</button>
    ${!opt.ky && opt.chapter === undefined && pc >= 70 ? `<button class="btn ky" onclick="kyotsu()">🎯 STEP2 共通テスト形式へ</button>` : ""}
    ${UNIT.lab && !opt.ky ? `<button class="btn lab" onclick="lab()">${UNIT.lab.icon} ${UNIT.lab.title}</button>` : ""}
    <button class="btn sub" onclick="home()">ホームにもどる</button>
    ${EXITS()}
    ${wrong.length ? `<h2 style="margin-top:18px">📒 まちがえた問題の復習</h2>${wrong.map(x => { const q = x.q; return `<div class="rv">${q.fmt ? `<span class="fmt">${q.fmt}</span>` : ""}<div class="qq">${q.q}</div>
      <div class="ya">あなたの答え：${x.picked || "—"}</div><div class="aa">正解：${ansOf(q)}</div><div>${q.e}</div>${more(q)}
      ${q.k === "st" ? whySt(q) : q.w ? `<div class="why">${q.c.map((c, j) => `<div><span class="no">${NO[j]}</span><span class="${j === q.a ? "okm" : "ngm"}">${j === q.a ? "○" : "×"}</span> ${q.w[j]}</div>`).join("")}</div>` : ""}
      ${q.tip ? `<div class="tip"><b class="h">🎯 共通テストではこう出る</b><br>${q.tip}</div>` : ""}${vlink(q.t)}</div>`; }).join("")}` : ""}
  </div>`);
  saveNow({ s: "result", o: opt, q: res.map(x => qid(x.q)), r: packRes(res) });
  if (pc >= 70 && !rs) confetti();
}

/* --- 単元ごとの「動かして覚える」（2026-10-24 政経3の形に統一）
   UNIT.lab.modes = [{ label, run(el) }（自由に動かす）| { label, game: {...} }（仕分けゲーム）]
   上にモード切替ボタン（①②…）、下に中身。ゲームは全単元で sortGame を使う。 --- */
function lab(m0) {
  track("lab");
  screen(`<div class="card pop"><div class="stage">${UNIT.lab.icon} ${UNIT.lab.title}</div><div id="labx"></div></div>
    <button class="btn sub" onclick="home()">ホームにもどる</button>`);
  const L = UNIT.lab; let mode = L.modes[m0] ? Number(m0) : 0, stop = null;
  const render = () => {
    if (stop) { stop(); stop = null; }
    saveNow({ s: "lab", m: mode });
    $("#labx").innerHTML = `<div class="row2" style="margin-top:6px">${L.modes.map((m, i) => `<button class="btn ${i === mode ? "main" : "sub"}" id="m${i}" style="margin-top:4px;padding:10px;font-size:14px">${NO[i]} ${m.label}</button>`).join("")}</div><div id="labin"></div>`;
    L.modes.forEach((m, i) => { $("#m" + i).onclick = () => { mode = i; render(); }; });
    const m = L.modes[mode];
    stop = (m.game ? sortGame($("#labin"), m.game) : m.run($("#labin"))) || null;
  };
  render();
  cleanup = () => { if (stop) stop(); };
}
/* 仕分けゲーム（全単元共通）：g = { deck:[{w,a,why}], btns:{key:ラベル}, ask, sec, perfect, retry, fig?(), onPick?(c), extra?(c) } */
function sortGame(el, g) {
  const deck = shuffle(g.deck); let i = 0, ok = 0;
  const one = () => {
    if (i >= deck.length) {
      const r = record(g.sec, ok, deck.length); markDone("lab");
      el.innerHTML = `<div class="score">${ok}/${deck.length}</div><div class="badge">${ok === deck.length ? "🎉 パーフェクト！" : "もう一回やってみよう"}</div>${cmpHtml(r)}
        ${bubble(ok === deck.length ? "fist-pump" : "thinking", ok === deck.length ? g.perfect : g.retry)}
        <button class="btn main" id="again">もう一度</button><button class="btn sub" onclick="traps()">⚠️ ひっかけ ○× へ</button>`;
      $("#again").onclick = () => sortGame(el, g); if (ok === deck.length) confetti(); return;
    }
    const c = deck[i];
    el.innerHTML = `${bubble("explain", g.ask)}
      <div class="fig">${g.fig ? g.fig() : ""}<div class="muted" style="text-align:center">${i + 1} / ${deck.length}　正解 ${ok}</div>
      <div class="sortcard" data-a="${c.a}">${c.w}</div>
      <div class="choices" id="gb">${Object.keys(g.btns).map(k => `<button data-k="${k}">${g.btns[k]}</button>`).join("")}</div><div id="sfb"></div></div>`;
    const bs = document.querySelectorAll("#gb button");
    bs.forEach(b => b.onclick = () => {
      const good = b.dataset.k === String(c.a); if (good) { ok++; addPts(5); }
      bs.forEach(x => { x.disabled = true; if (x.dataset.k === String(c.a)) x.classList.add("ok"); }); if (!good) b.classList.add("ng");
      if (g.onPick) g.onPick(c);
      $("#sfb").innerHTML = `<div class="fb ${good ? "ok" : "ng"} pop"><h3>${good ? "⭕ 正解！ +5pt" : "❌ ざんねん…"}</h3>${c.why}${g.extra ? g.extra(c) : ""}</div><button class="btn main" id="sn">次へ</button>`;
      glossify($("#sfb"));
      $("#sn").onclick = () => { i++; one(); };
      $("#sn").scrollIntoView({ behavior: "smooth", block: "end" });
    });
  };
  one();
  return null;
}

/* --- 紙ふぶき --- */
function confetti() {
  const cv = $("#cf"), x = cv.getContext("2d"); cv.width = innerWidth; cv.height = innerHeight;
  const P = Array.from({ length: 90 }, () => ({ x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .5, v: 2 + Math.random() * 3, r: Math.random() * 6.28, c: ["#ff6b57", "#17939e", "#ffd166", "#2f7fd1"][Math.floor(Math.random() * 4)] }));
  let f = 0; const tick = () => { x.clearRect(0, 0, cv.width, cv.height);
    P.forEach(p => { p.y += p.v; p.r += .1; x.save(); x.translate(p.x + Math.sin(p.r) * 8, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-4, -3, 8, 6); x.restore(); });
    if (++f < 150) requestAnimationFrame(tick); else x.clearRect(0, 0, cv.width, cv.height); };
  tick();
}

$("#gsheet").onclick = e => { if (e.target.id === "gsheet" || e.target.id === "gcl") closeSheet(); };
$("#vclose").onclick = closePlayer; $("#vp").onclick = e => { if (e.target.id === "vp") closePlayer(); };
$("#hlogo").src = IMG["logo-dark"]; $("#hlogo").onclick = home;
$("#ht1").textContent = LABEL; $("#ht2").innerHTML = UNIT.titleHtml || UNIT.title;
$("#pt").textContent = pts + " pt";
/* 2026-11-07 YouTube から戻ってページが読み込み直されたときは、はじめにではなく、さっきの画面にもどす */
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
if (!restoreNow()) intro();
</script>
